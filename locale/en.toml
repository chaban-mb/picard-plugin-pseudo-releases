"provider.caa.title" = "Cover Art Archive: Pseudo-Release (Original)"
"ui.info_pseudo_releases" = """MusicBrainz [pseudo-releases](https://musicbrainz.org/doc/Style/Specific_types_of_releases/Pseudo-Releases) contain alternate tracklists (such as transliterated or translated titles) linked to an original release via the [transl-tracklisting](https://musicbrainz.org/relationship/fc399d47-23a7-4c28-bfcf-0607a562b644) relationship.

When a pseudo-release is loaded, this plugin automatically supplements catalog metadata (`date`, `releasecountry`, `barcode`, `label`, `catalognumber`, and `media`) from the best-matched original release, retaining the pseudo-release's translated tracklist intact.

Additionally, the original release ID is made available to tagger scripts and file naming scripts via the hidden variable `%_original_musicbrainz_albumid%`."""
