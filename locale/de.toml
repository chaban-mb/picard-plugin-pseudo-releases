"provider.caa.title" = "Cover-Art Archiv: Pseudo-Veröffentlichung (Original)"
"ui.info_pseudo_releases" = """MusicBrainz-[Pseudo-Releases](https://musicbrainz.org/doc/Style/Specific_types_of_releases/Pseudo-Releases) enthalten alternative Titellisten (wie transliterierte oder übersetzte Titel), die über die Beziehung [transl-tracklisting](https://musicbrainz.org/relationship/fc399d47-23a7-4c28-bfcf-0607a562b644) mit einer Originalveröffentlichung verknüpft sind.

Beim Laden eines Pseudo-Releases ergänzt dieses Plugin Katalog-Metadaten (`date`, `releasecountry`, `barcode`, `label`, `catalognumber` und `media`) automatisch anhand der am besten passenden Originalveröffentlichung und behält die übersetzte Titelliste des Pseudo-Releases vollständig bei.

Zusätzlich steht die ID der Originalveröffentlichung in Tagger- und Dateibenennungsskripten über die versteckte Variable `%_original_musicbrainz_albumid%` zur Verfügung."""
